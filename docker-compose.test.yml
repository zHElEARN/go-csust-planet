services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: planet_test
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planet_test"]
      interval: 2s
      timeout: 5s
      retries: 10
