      description: 根据公告ID更新后台公告
      parameters:
      - description: Bearer admin token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 公告ID
        in: path
        name: id
        required: true
        type: string
      - description: 公告信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/announcement.upsertRequest'
      produces:
