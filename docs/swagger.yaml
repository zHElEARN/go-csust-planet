basePath: /v1
definitions:
  announcement.adminAnnouncementResponse:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isBanner:
        type: boolean
      title:
        type: string
    type: object
  announcement.announcementResponse:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isBanner:
        type: boolean
      title:
        type: string
    type: object
  announcement.upsertRequest:
    properties:
      content:
        type: string
      isActive:
        type: boolean
      isBanner:
        type: boolean
      title:
        type: string
    required:
    - content
    - isActive
    - isBanner
    - title
    type: object
  appversion.adminResponse:
    properties:
      createdAt:
        type: string
      downloadUrl:
        type: string
      id:
        type: string
      isForceUpdate:
        type: boolean
      platform:
        type: string
      releaseNotes:
        type: string
      versionCode:
        type: integer
      versionName:
        type: string
    type: object
  appversion.checkResponse:
    properties:
      hasUpdate:
        type: boolean
      isForceUpdate:
        type: boolean
      latestVersion:
        $ref: '#/definitions/appversion.publicResponse'
    type: object
  appversion.publicResponse:
    properties:
      createdAt:
        type: string
      downloadUrl:
        type: string
      isForceUpdate:
        type: boolean
      platform:
        type: string
      releaseNotes:
        type: string
      versionCode:
        type: integer
      versionName:
        type: string
    type: object
  appversion.upsertRequest:
    properties:
      downloadUrl:
        type: string
      isForceUpdate:
        type: boolean
      platform:
        enum:
        - ios
        - android
        type: string
      releaseNotes:
        type: string
      versionCode:
        type: integer
      versionName:
        type: string
    required:
    - downloadUrl
    - isForceUpdate
    - platform
    - releaseNotes
    - versionCode
    - versionName
    type: object
  campusmap.FeatureGeometry:
    properties:
      coordinates:
        items:
          items:
            items:
              format: float64
              type: number
            type: array
          type: array
        type: array
      type:
        type: string
    type: object
  campusmap.FeatureProperties:
    properties:
      campus:
        type: string
      category:
        type: string
      name:
        type: string
    type: object
  campusmap.featureResponse:
    properties:
      geometry:
        $ref: '#/definitions/campusmap.FeatureGeometry'
      properties:
        $ref: '#/definitions/campusmap.FeatureProperties'
      type:
        type: string
    type: object
  campusmap.responseBody:
    properties:
      features:
        items:
          $ref: '#/definitions/campusmap.featureResponse'
        type: array
      type:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  semestercalendar.CalendarNote:
    properties:
      content:
        type: string
      needNumber:
        type: boolean
      row:
        type: integer
    type: object
  semestercalendar.CustomWeekRange:
    properties:
      content:
        type: string
      endRow:
        type: integer
      startRow:
        type: integer
    type: object
  semestercalendar.adminResponse:
    properties:
      calendarEnd:
        type: string
      calendarStart:
        type: string
      createdAt:
        type: string
      customWeekRanges:
        items:
          $ref: '#/definitions/semestercalendar.CustomWeekRange'
        type: array
      notes:
        items:
          $ref: '#/definitions/semestercalendar.CalendarNote'
        type: array
      semesterCode:
        type: string
      semesterEnd:
        type: string
      semesterStart:
        type: string
      subtitle:
        type: string
      title:
        type: string
    type: object
  semestercalendar.detailResponse:
    properties:
      calendarEnd:
        type: string
      calendarStart:
        type: string
      customWeekRanges:
        items:
          $ref: '#/definitions/semestercalendar.CustomWeekRange'
        type: array
      notes:
        items:
          $ref: '#/definitions/semestercalendar.CalendarNote'
        type: array
      semesterCode:
        type: string
      semesterEnd:
        type: string
      semesterStart:
        type: string
      subtitle:
        type: string
      title:
        type: string
    type: object
  semestercalendar.listResponse:
    properties:
      semesterCode:
        type: string
      subtitle:
        type: string
      title:
        type: string
    type: object
  semestercalendar.upsertRequest:
    properties:
      calendarEnd:
        type: string
      calendarStart:
        type: string
      customWeekRanges:
        items:
          $ref: '#/definitions/semestercalendar.CustomWeekRange'
        type: array
      notes:
        items:
          $ref: '#/definitions/semestercalendar.CalendarNote'
        type: array
      semesterCode:
        type: string
      semesterEnd:
        type: string
      semesterStart:
        type: string
      subtitle:
        type: string
      title:
        type: string
    required:
    - calendarEnd
    - calendarStart
    - semesterCode
    - semesterEnd
    - semesterStart
    - subtitle
    - title
    type: object
host: localhost:8080
info:
  contact: {}
  description: go-csust-planet 项目的 API 接口文档
