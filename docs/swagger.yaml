  version: "1.0"
paths:
  /admin/announcements:
    get:
      description: 获取全部公告列表，按创建时间倒序排列
      parameters:
      - description: Bearer admin token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/announcement.adminAnnouncementResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取后台公告列表
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: 创建一条新的后台公告
      parameters:
      - description: Bearer admin token
        in: header
        name: Authorization
        required: true
