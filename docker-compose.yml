services:
  go-csust-planet:
    image: go-csust-planet:${PROD_TAG}
    container_name: go-csust-planet
    restart: always
    env_file:
      - production.env
    ports:
      - "7242:7242"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 128M
  go-csust-planet-dev:
    image: go-csust-planet:${DEV_TAG}
    container_name: go-csust-planet-dev
    restart: always
    env_file:
      - development.env
    ports:
      - "7241:7241"
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 96M
